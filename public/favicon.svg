<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#1a1918" rx="20"/>
  <g filter="url(#glow)">
    <!-- Flower Petals -->
    <path d="M50 25 C50 10, 30 10, 30 35 C30 50, 50 50, 50 50 C50 50, 70 50, 70 35 C70 10, 50 10, 50 25" fill="#d4c5b0" opacity="0.9"/>
    <path d="M50 75 C50 90, 70 90, 70 65 C70 50, 50 50, 50 50 C50 50, 30 50, 30 65 C30 90, 50 90, 50 75" fill="#d4c5b0" opacity="0.9"/>
    <path d="M25 50 C10 50, 10 70, 35 70 C50 70, 50 50, 50 50 C50 50, 50 30, 35 30 C10 30, 10 50, 25 50" fill="#d4c5b0" opacity="0.9"/>
    <path d="M75 50 C90 50, 90 30, 65 30 C50 30, 50 50, 50 50 C50 50, 50 70, 65 70 C90 70, 90 50, 75 50" fill="#d4c5b0" opacity="0.9"/>
    <!-- Center -->
    <circle cx="50" cy="50" r="8" fill="#e8e6e3"/>
  </g>
</svg>